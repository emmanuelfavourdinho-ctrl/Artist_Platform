<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0B0B0C">
    <title>Offline · Fine Arts</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0B0B0C; color: #F4F3EF; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom)); }
      main { width: min(100%, 28rem); text-align: center; }
      img { width: 5rem; height: 5rem; object-fit: cover; border-radius: 1rem; border: 1px solid rgb(244 243 239 / .15); }
      h1 { margin: 1.5rem 0 .5rem; font: 600 1.75rem/1.2 Georgia, serif; }
      p { color: #8A8A8D; line-height: 1.7; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: 1.5rem; }
      a, button { min-height: 2.75rem; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: .65rem 1.1rem; border: 1px solid rgb(244 243 239 / .2); color: #F4F3EF; background: transparent; font: inherit; text-decoration: none; cursor: pointer; }
      button { color: #141004; background: #E3B341; border-color: #E3B341; font-weight: 600; }
      a:focus-visible, button:focus-visible { outline: 2px solid #E3B341; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/fine-arts-192.png" alt="">
      <h1>You’re offline</h1>
      <p>Reconnect to continue browsing Fine Arts. Your private account and conversations are never stored in this offline page.</p>
      <nav aria-label="Offline options">
        <button type="button" onclick="window.location.reload()">Try again</button>
        <a href="/">Home</a>
        <a href="/messages">Messages</a>
      </nav>
    </main>
  </body>
</html>
